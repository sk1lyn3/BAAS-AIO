name: Prepare AIO Release
run-name: Prepare ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v1.1.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: aio-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-config
          persist-credentials: false
      - name: Validate release tag and notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -s "release-config/.github/release-notes/$RELEASE_TAG.md"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: aio
          submodules: true
          persist-credentials: false
      - name: Read pinned core versions from the release source
        id: core
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          defaults = {}
          key = None
          for line in pathlib.Path('aio/.github/workflows/build-apk.yml').read_text().splitlines():
              if line.startswith('      ') and not line.startswith('       '):
                  key = line.strip().rstrip(':')
              elif key and line.strip().startswith('default:'):
                  defaults[key] = line.split('default:', 1)[1].strip()
          version = re.search(r'versionName = "([^"]+)"', pathlib.Path('aio/app/build.gradle.kts').read_text()).group(1)
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag does not match APK version'
          defaults['baas_path'] = 'baas-core'
          if pathlib.Path('aio/.gitmodules').exists():
              url = subprocess.check_output(['git', 'config', '-f', 'aio/.gitmodules', '--get', 'submodule.baas-core.url'], text=True).strip()
              defaults['baas_repository'] = url.removeprefix('https://github.com/').removesuffix('.git')
              defaults['baas_ref'] = subprocess.check_output(['git', '-C', 'aio/baas-core', 'rev-parse', 'HEAD'], text=True).strip()
              defaults['baas_path'] = 'aio/baas-core'
          assert re.fullmatch(r'[\w.-]+/[\w.-]+', defaults['baas_repository'])
          for key in ('baas_ref', 'ocr_revision'):
              assert re.fullmatch(r'[0-9a-f]{40}', defaults[key]), 'Release builds require pinned commits'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('baas_repository', 'baas_ref', 'ocr_revision', 'baas_path'):
                  output.write(f'{key}={defaults[key]}\n')
          PY
      - uses: actions/checkout@v4
        if: steps.core.outputs.baas_path == 'baas-core'
        with:
          repository: ${{ steps.core.outputs.baas_repository }}
          ref: ${{ steps.core.outputs.baas_ref }}
          path: baas-core
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Fetch pinned OCR prebuild
        env:
          OCR_REVISION: ${{ steps.core.outputs.ocr_revision }}
        run: |
          git init ocr-prebuild
          git -C ocr-prebuild remote add origin https://gitee.com/pur1fy/baas_-cpp_prebuild.git
          git -C ocr-prebuild fetch --depth=1 origin "$OCR_REVISION"
          git -C ocr-prebuild update-ref refs/remotes/origin/android-arm64-v8a "$(git -C ocr-prebuild rev-parse FETCH_HEAD)"
      - name: Build signed Release and Debug APKs
        env:
          OCR_PREBUILD: ${{ github.workspace }}/ocr-prebuild
          APK_OUTPUT_DIR: ${{ github.workspace }}/apk-artifacts
          BAAS_SOURCE: ${{ github.workspace }}/${{ steps.core.outputs.baas_path }}
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          : "${APK_KEYSTORE_B64:?Configure signing secrets before publishing}"
          export APK_KEYSTORE="$RUNNER_TEMP/aio-signing.keystore"
          trap 'rm -f -- "$APK_KEYSTORE"' EXIT
          printf '%s' "$APK_KEYSTORE_B64" | base64 --decode > "$APK_KEYSTORE"
          chmod 600 "$APK_KEYSTORE"
          for variant in release debug; do
            aio/tools/build_apk.sh "$BAAS_SOURCE" "$variant" HEAD
            cp "$APK_OUTPUT_DIR/build-info.json" "$APK_OUTPUT_DIR/build-info-$variant.json"
            cat "$APK_OUTPUT_DIR/build-info.json" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: baas-aio-${{ inputs.tag }}
          path: apk-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          notes="release-config/.github/release-notes/$RELEASE_TAG.md"
          # The tag endpoint omits drafts; list releases so a retry finds the existing draft.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id' > "$RUNNER_TEMP/release-ids.txt"
          mapfile -t release_ids < "$RUNNER_TEMP/release-ids.txt"
          test "${#release_ids[@]}" -le 1
          if [[ "${#release_ids[@]}" -eq 1 ]]; then
            release_id="${release_ids[0]}"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release.json"
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["draft"], "Published releases cannot be overwritten"' "$RUNNER_TEMP/release.json"
            gh release upload "$RELEASE_TAG" apk-artifacts/*.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" apk-artifacts/*.apk --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$notes"
          fi
